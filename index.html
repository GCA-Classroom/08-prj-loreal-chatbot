
<div class="chatbox">

  <!-- Latest Question Display -->
  <div class="latest-question" id="latestQuestion" hidden>
    <span class="latest-question-label">
      YOUR LATEST QUESTION
    </span>
    <p id="latestQuestionText"></p>
  </div>

  <!-- Conversation History -->
  <div
    id="chatWindow"
    class="chat-window"
    role="log"
    aria-live="polite"
    aria-relevant="additions text"
  ></div>

  <!-- Chat Input -->
  <form id="chatForm" class="chat-form">
    <label for="userInput" class="visually-hidden">
      Ask a beauty question
    </label>

    <input
      type="text"
      id="userInput"
      placeholder="Ask me anything about beauty..."
      autocomplete="off"
      required
    />

    <button type="submit" id="sendBtn">
      Send
    </button>
  </form>

</div>
